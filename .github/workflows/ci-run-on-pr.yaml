name: CI run on PR
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  # The required checks also run in the merge queue (always everything): the tested commit is what lands on main
  merge_group:

env:
  # Golang version to use across CI steps
  GOLANG_VERSION: '1.26' # Updated to match go.mod requirement (go 1.26.0)

permissions:
  contents: read

jobs:
  codechanges:
    runs-on: ubuntu-22.04
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The path filter only applies to pull requests (changed-files doesn't work in the merge queue)
      - uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        if: github.event_name == 'pull_request'
        id: filter
        with:
          # Any file which is not under docs/, examples/, or is not a markdown file is counted as a backend file
          # Also run when ci-run-on-pr has been changed to validate it is working
          files_yaml: |
            backend:
              - '!**.md'
              - '!**/*.md'
              - '!docs/**'
              - '!examples/**'
              - '!.github/**'
            ci:
              - '.github/workflows/ci-run-on-pr.yaml'
      - name: Decide what runs
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          DRAFT: ${{ github.event.pull_request.draft }}
          BACKEND_CHANGED: ${{ steps.filter.outputs.backend_any_changed }}
          CI_CHANGED: ${{ steps.filter.outputs.ci_any_changed }}
        run: |
          if [ "${EVENT}" != pull_request ]; then
            # Run everything in the merge queue
            run=true
          elif [ "${DRAFT}" = true ]; then
            run=false
          elif [ "${BACKEND_CHANGED}" = true ] || [ "${CI_CHANGED}" = true ]; then
            run=true
          else
            run=false
          fi
          echo "run=${run}"
          echo "run=${run}" >> "${GITHUB_OUTPUT}"

  check-go:
    name: Ensure Go modules synchronicity
    runs-on: ubuntu-22.04
    needs:
      - codechanges
    if: needs.codechanges.outputs.run == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Golang
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ env.GOLANG_VERSION }}
      - name: Download all Go modules
        run: |
          go mod download
      - name: Check for tidiness of go.mod and go.sum
        run: |
          go mod tidy
          git diff --exit-code -- .

  lint-go:
    name: Lint Go code
    runs-on: ubuntu-22.04
    needs:
      - codechanges
    if: needs.codechanges.outputs.run == 'true'
    permissions:
      contents: read # for actions/checkout to fetch code
      pull-requests: read # for golangci/golangci-lint-action to fetch pull requests
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Golang
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ env.GOLANG_VERSION }}
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          # Built with go install (from the Go module proxy) instead of downloaded from GitHub releases
          version: v2.15.0
          install-mode: goinstall
          args: --verbose --timeout=10m

  shellcheck:
    name: Shellcheck
    needs:
      - codechanges
    if: needs.codechanges.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # shellcheck is preinstalled on the ubuntu runners, so this doesn't depend on a download from GitHub releases
      - name: Run ShellCheck
        run: |
          shellcheck --version
          git ls-files -z '*.sh' '*.bash' | xargs -0 --no-run-if-empty shellcheck

  unit-test:
    name: Run unit tests
    runs-on: ubuntu-latest
    needs:
      - codechanges
    permissions:
      pull-requests: write
    if: needs.codechanges.outputs.run == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Golang
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ env.GOLANG_VERSION }}
      - name: Test
        run: make test
      - name: check test coverage
        id: coverage
        uses: vladopajic/go-test-coverage@6890500b00a7e5862e54662c04ea9fa7c799ce1e # v2.23.0
        with:
          config: .testcoverage.yaml
          profile: cover.out
        continue-on-error: true # Should fail after coverage comment is posted
      - name: Generate test results artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unittests-coverage
          path: cover.out
      - name: find pull request ID
        if: github.event_name == 'pull_request'
        run: |
          PR_ID=${GITHUB_REF_NAME%%/merge}
          echo "PR_ID: $PR_ID"

          if [ "$PR_ID" != "null" ]; then
            echo "pull_request_id=$PR_ID" >> $GITHUB_ENV
          else
            echo "No open pull request found for this branch."
          fi
      - name: create badge
        if: github.ref_name == 'main'
        uses: vladopajic/go-test-coverage@6890500b00a7e5862e54662c04ea9fa7c799ce1e # v2.23.0
        with:
          profile: cover.out
          git-token: ${{ secrets.GITHUB_TOKEN }}
          git-branch: badges
      - name: post coverage report
        if: github.event_name == 'pull_request' && env.pull_request_id
        uses: thollander/actions-comment-pull-request@v3
        continue-on-error: true #we need pull_request_target or this will fail when not running pr in BD organisation
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          comment-tag: coverage-report
          pr-number: ${{ env.pull_request_id }}
          message: |
            go-test-coverage report:
            ```
            ${{ fromJSON(steps.coverage.outputs.report) }}```
      - name: 'finally check coverage'
        if: steps.coverage.outcome == 'failure'
        shell: bash
        run: echo "coverage check failed" && exit 1

  e2e-test:
    name: Run e2e tests
    runs-on: ubuntu-22.04
    needs:
      - codechanges
    if: needs.codechanges.outputs.run == 'true'
    strategy:
      matrix:
        pgversion: ['14','15','16','17','18']
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Golang
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ env.GOLANG_VERSION }}

      - name: Test
        run: make e2e-test
        env:
          PGVERSION: ${{ matrix.pgversion }}

  check-e2e-status:
    runs-on: ubuntu-latest
    needs: e2e-test
    if: always() # Cruciaal: moet altijd draaien
    steps:
      - name: Evaluate e2e status
        run: |
          RESULT="${{ needs.e2e-test.result }}"
          
          echo "E2E result: $RESULT"

          if [ "$RESULT" = "failure" ]; then
            exit 1
          elif [ "$RESULT" = "success" ] || [ "$RESULT" = "skipped" ]; then
            exit 0
          else
            echo "Tests were cancelled."
            exit 1
          fi

  # The only required check of this workflow, so the ruleset doesn't change when jobs are added. It must always run,
  # and only passes when every job it needs succeeded (a skipped required check would count as a pass).
  ci-result:
    name: CI result
    runs-on: ubuntu-latest
    needs:
      - codechanges
      - check-go
      - lint-go
      - shellcheck
      - unit-test
      - e2e-test
      - check-e2e-status
    if: always()
    steps:
      - name: Evaluate the results
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
          EVENT: ${{ github.event_name }}
        run: |
          echo "Results: ${RESULTS} (event: ${EVENT})"
          # A job skipped by a path filter is fine on a pull request; everywhere else everything must run
          if [ "${EVENT}" = pull_request ]; then ok='. == "success" or . == "skipped"'; else ok='. == "success"'; fi
          if [ "$(echo "${RESULTS}" | jq -r "all(${ok})")" != true ]; then
            echo "::error::All CI jobs must succeed"
            exit 1
          fi
